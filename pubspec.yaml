name: yizhanghe
description: 壹ZHANG核 - 文玩核桃收藏管理 App
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.0
  # 保存图片到系统相册（大图页「保存到手机」按钮，MediaStore 方式免存储权限）
  gal: ^2.3.0
  # V2：NAS 同步（WebDAV 通用客户端 + 极空间适配）共用底层 HTTP
  http: ^1.2.0
  # V2：Windows 桌面端 SQLite 支持（FFI 实现；Android 走原 sqflite 不受影响）
  sqflite_common_ffi: ^2.3.0
  # Digest 鉴权需要的 md5（dart:convert 未导出 md5）
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # 图标资产（CI 出包流程从此处拷回 android/app/src/main/res/mipmap-*）
  assets:
    - assets/icon/source.png
    - assets/theme/ruihetu.jpg
    - assets/seed/walnuts.json

# sqlite3（由 sqflite_common_ffi 传递引入，仅 Windows 端实际使用）的
# build hook 会为所有目标平台（含 arm64 Android）下载预编译 libsqlite3.so，
# 默认地址在 GitHub，国内直连必然超时（实测 HTTP 000 / 21s无响应）。
# url_pattern 支持 $RELEASE_TAG 与 $FILENAME 占位符，改为国内镜像。
# 注意 $RELEASE_TAG 本身已含 sqlite3- 前缀，不要重复拼接。
# 实测 gh-proxy.com 明显更快（1.1s / 7.9s），ghfast.top 可作备选。
hooks:
  user_defines:
    sqlite3:
      url_pattern: https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME
