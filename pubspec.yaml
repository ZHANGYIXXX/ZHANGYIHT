name: yizhanghe
description: 壹ZHANG核 - 文玩核桃收藏管理 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # 图标资产（CI 出包流程从此处拷回 android/app/src/main/res/mipmap-*）
  assets:
    - assets/icon/source.png
