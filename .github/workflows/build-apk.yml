name: Build V2 (Android + Windows)

# 云端编译 v7（V2）：双端出包
#  - job android: 修复版 APK（固定签名 + .so 不压缩 + 启动自检，沿用 V1 验证过的流程）
#  - job windows: PC 端免安装 zip（sqflite_common_ffi + 自带 sqlite3.dll）
# 触发：push 到 v2 / main / master，或手动 workflow_dispatch
on:
  push:
    branches: [ main, master, v2 ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Regenerate android scaffold with this exact Flutter version
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          rm -rf android
          # 关键：--org com.example 使生成的 Kotlin 包 = com.example.yizhanghe，
          # 与 build.gradle.kts 的 namespace/applicationId 完全一致。
          # 此前用 com.yizhanghe 导致 dex 类名 com.yizhanghe.yizhanghe.MainActivity
          # 与 Manifest 声明 com.example.yizhanghe.MainActivity 不一致
          # → ClassNotFoundException → 打开即闪退（安装正常、CI 全绿但无法启动）。
          flutter create --platforms=android --org com.example --project-name yizhanghe . 2>&1 | tee /tmp/create.log
          cp /tmp/main_backup.dart lib/main.dart
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          # 断言：MainActivity 包名必须等于 namespace，否则构建必闪退
          set -e
          grep -q "^package com.example.yizhanghe$" android/app/src/main/kotlin/com/example/yizhanghe/MainActivity.kt
          echo "MainActivity package OK: com.example.yizhanghe"

      - name: Inject camera and gallery permissions + app name
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxsdkversion="28" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          grep "uses-permission" android/app/src/main/AndroidManifest.xml
          # flutter create 会把 label 重置为 project-name(yizhanghe)，这里强制改回软件名
          sed -i 's|android:label="yizhanghe"|android:label="ZHANGYIWW"|' android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Restore launcher icons
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f "assets/icon/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "Restored launcher icons:"
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Configure fixed release signing (same keystore for every build)
        run: |
          set -e
          tr -d '\r' < ci/release.p12.b64 | base64 -d > android/app/release.p12
          ls -l android/app/release.p12
          cat > android/key.properties <<'EOF'
          storeFile=release.p12
          storePassword=yizhanghe-release-2026
          keyAlias=yizhanghe
          keyPassword=yizhanghe-release-2026
          storeType=pkcs12
          EOF
          cat android/key.properties
          # 覆盖 flutter create 生成的默认 build.gradle.kts，改用固定签名 + .so 不压缩
          cat > android/app/build.gradle.kts <<'KTS'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.yizhanghe"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              // 华为/HarmonyOS linker 无法加载压缩 .so → 打开即闪退。
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.example.yizhanghe"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storePassword = "yizhanghe-release-2026"
                      keyAlias = "yizhanghe"
                      keyPassword = "yizhanghe-release-2026"
                      storeType = "pkcs12"
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          flutter {
              source = "../.."
          }

          androidComponents {
              onVariants { variant ->
                  variant.packaging.jniLibs.useLegacyPackaging.set(true)
              }
          }
          KTS
          echo "build.gradle.kts written"

      - name: Accept Android licenses and install missing SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$PATH"
          yes | flutter doctor --android-licenses 2>&1 | tee /tmp/licenses.log || true
          yes | sdkmanager --licenses 2>&1 | tee -a /tmp/licenses.log || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a /tmp/licenses.log || true

      - name: Get dependencies
        run: flutter pub get 2>&1 | tee /tmp/pubget.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Verify APK produced
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "::error::APK file not found - build did not produce output"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: Force uncompressed native libs + align + re-sign (fix Huawei launch crash)
        run: |
          set -e
          python3 ci/uncompress_so.py build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p 4 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks android/app/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias yizhanghe \
            --ks-pass pass:yizhanghe-release-2026 \
            --key-pass pass:yizhanghe-release-2026 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk
          cp build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk
          echo "=== .so compression after fix ==="
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("build/app/outputs/flutter-apk/app-release.apk")
          so=[i.filename for i in z.infolist() if i.filename.endswith('.so') and i.compress_type==8]
          print("compressed .so:", so if so else "NONE (all uncompressed)")
          PY
          echo "=== signing verify ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk 2>&1 | grep -i "signer"

      - name: Static launch self-check (manifest activity == dex class)
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          LAUNCH=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -oP "launchable-activity: name='\K[^']+")
          echo "launchable-activity: $LAUNCH"
          rm -rf /tmp/dexck && mkdir -p /tmp/dexck && cd /tmp/dexck
          unzip -o -q "$GITHUB_WORKSPACE/$APK" 'classes*.dex'
          FOUND=0
          for d in classes*.dex; do
            if "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$d" | grep -q "L${LAUNCH//./\/};"; then FOUND=1; fi
          done
          if [ "$FOUND" != "1" ]; then
            echo "::error::launchable-activity '$LAUNCH' NOT FOUND in dex — app would crash on launch!"
            exit 1
          fi
          echo "launch self-check PASSED: $LAUNCH exists in dex"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "### Dart / build errors"
            echo '```'
            if [ -f /tmp/build.log ]; then
              grep -nE "^lib/|^test/|\.dart:[0-9]+|Error:|error •|is not defined|isn't defined|Undefined|Cannot |Expected |Unexpected |Unresolved " /tmp/build.log | head -50
            fi
            echo '```'
            echo ""
            echo "### build.log tail 60"
            echo '```'
            [ -f /tmp/build.log ] && tail -60 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          DART=$(grep -nE "\.dart:[0-9]+|Error:|is not defined|isn't defined|Undefined|Expected " /tmp/build.log 2>/dev/null | head -20 | tr '\n' ' ' | cut -c1-2500)
          if [ -z "$DART" ]; then
            DART=$(tail -30 /tmp/build.log 2>/dev/null | tr '\n' ' ' | cut -c1-2500)
          fi
          echo "::error title=Build failed::${DART}"

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate windows scaffold (repo has no windows/ dir)
        shell: pwsh
        run: |
          Copy-Item lib/main.dart $env:TEMP\main_backup.dart
          Copy-Item pubspec.yaml $env:TEMP\pubspec_backup.yaml
          flutter create --platforms=windows --org com.example --project-name yizhanghe . 2>&1 | Tee-Object $env:TEMP\create.log
          Copy-Item $env:TEMP\main_backup.dart lib/main.dart -Force
          Copy-Item $env:TEMP\pubspec_backup.yaml pubspec.yaml -Force
          # 应用名：flutter create 默认 yizhanghe → 改成 ZHANGYIWW
          $rc = "windows\runner\Runner.rc"
          (Get-Content $rc) -replace 'yizhanghe', 'ZHANGYIWW' | Set-Content $rc
          $rw = "windows\runner\main.cpp"
          if (Test-Path $rw) { (Get-Content $rw) -replace 'yizhanghe', 'ZHANGYIWW' | Set-Content $rw }
          Get-Content $rc | Select-String "AppName|yizhanghe|ZHANGYIWW"

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Bundle sqlite3.dll for sqflite_ffi
        shell: pwsh
        run: |
          # sqflite_common_ffi 需要 sqlite3.dll；优先从 pub 缓存取，
          # 找不到再动态解析 sqlite.org 最新预编译 dll（不再硬编码版本/年份，避免 404）
          $dst = "build\windows\x64\runner\Release"
          if (-not (Test-Path $dst)) { New-Item -ItemType Directory -Force -Path $dst | Out-Null }

          $src = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache" -Recurse -Filter "sqlite3.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName "$dst\sqlite3.dll" -Force
            Write-Host "sqlite3.dll bundled from pub cache: $($src.FullName)"
          } else {
            Write-Host "pub cache 中无 sqlite3.dll，转从 sqlite.org 动态解析最新 x64 预编译包..."
            $html = (Invoke-WebRequest -Uri "https://www.sqlite.org/download.html" -UseBasicParsing).Content
            $m = [regex]::Match($html, 'href="(\.\./)?(\d{4})/sqlite-dll-win-x64-(\d+)\.zip"')
            if (-not $m.Success) { throw "未能从 sqlite.org/download.html 解析到 sqlite-dll-win-x64 链接" }
            $year = $m.Groups[2].Value
            $ver = $m.Groups[3].Value
            $url = "https://www.sqlite.org/$year/sqlite-dll-win-x64-$ver.zip"
            Write-Host "解析到下载链接: $url"
            $tmp = "$env:TEMP\sq.zip"
            Invoke-WebRequest -Uri $url -OutFile $tmp
            Expand-Archive -Path $tmp -DestinationPath "$env:TEMP\sq" -Force
            Copy-Item "$env:TEMP\sq\sqlite3.dll" "$dst\sqlite3.dll" -Force
            Write-Host "sqlite3.dll downloaded ($ver)"
          }

          # 断言：缺 dll 出包必闪退，提前 fail 而非带病出包
          if (-not (Test-Path "$dst\sqlite3.dll")) {
            throw "sqlite3.dll 仍未就位，Windows 端将无法启动（sqflite_ffi 依赖）"
          }
          Get-ChildItem $dst | Select-Object Name,Length

      - name: Package portable zip
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$rel\*" -DestinationPath "ZHANGYIWW-PC-portable.zip" -Force
          Get-Item "ZHANGYIWW-PC-portable.zip" | Select-Object Name,Length

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: ZHANGYIWW-PC-portable
          path: ZHANGYIWW-PC-portable.zip
          if-no-files-found: error
