name: Build APK

# 云端编译（自诊断版 v5 · 固定签名）
# 关键：本工程代码按 Flutter 3.47 编写，故跟随最新 stable（>= 3.47），
# 并由同一版本重建 android 骨架保证一致。
#
# 签名策略（修复「无法覆盖安装」）：
# 旧版每次 CI 都重新生成临时 keystore，但 release 实际仍用 runner 自带 debug 签名
# → 每次构建签名都不同 → 手机提示「必须卸载旧版才能安装」。
# 现改为：仓库内提交一把【固定】 PKCS12 签名密钥（ci/release.p12.b64，base64 文本），
# 每次构建都解出同一把密钥 → 所有出包签名完全一致 → 可直接覆盖安装。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 只给 channel，不给 flutter-version —— 表示"取最新稳定版"。
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Regenerate android scaffold with this exact Flutter version
        run: |
          cp lib/main.dart /tmp/main_backup.dart
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          rm -rf android
          flutter create --platforms=android --org com.yizhanghe --project-name yizhanghe . 2>&1 | tee /tmp/create.log
          cp /tmp/main_backup.dart lib/main.dart
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Inject camera and gallery permissions + app name
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          grep "uses-permission" android/app/src/main/AndroidManifest.xml
          # flutter create 会把 label 重置为 project-name(yizhanghe)，这里强制改回软件名
          sed -i 's|android:label="yizhanghe"|android:label="ZHANGYIWW"|' android/app/src/main/AndroidManifest.xml
          grep 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Restore launcher icons
        # flutter create 会生成默认 Flutter logo 图标，必须从仓库 assets/icon/ 备份恢复「壹核 ZHANG」图标
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f "assets/icon/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          echo "Restored launcher icons:"
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Configure fixed release signing (same keystore for every build)
        # 从仓库内 base64 还原同一把 PKCS12 密钥，保证所有出包签名完全一致，可直接覆盖安装。
        run: |
          set -e
          # 去除可能的 \r（Windows/CRLF 会让 base64 -d 报 invalid input），再解码
          tr -d '\r' < ci/release.p12.b64 | base64 -d > android/app/release.p12
          ls -l android/app/release.p12
          cat > android/key.properties <<'EOF'
          storeFile=release.p12
          storePassword=yizhanghe-release-2026
          keyAlias=yizhanghe
          keyPassword=yizhanghe-release-2026
          storeType=pkcs12
          EOF
          cat android/key.properties
          # 覆盖 flutter create 生成的默认 build.gradle.kts，改用上面的固定签名
          cat > android/app/build.gradle.kts <<'KTS'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.yizhanghe"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.example.yizhanghe"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      val keyPropsFile = rootProject.file("key.properties")
                      if (keyPropsFile.exists()) {
                          val props = java.util.Properties().apply { load(keyPropsFile.inputStream()) }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                          storeType = props["storeType"] as String? ?: "pkcs12"
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          flutter {
              source = "../.."
          }
          KTS
          echo "build.gradle.kts written"

      - name: Accept Android licenses and install missing SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$PATH"
          yes | flutter doctor --android-licenses 2>&1 | tee /tmp/licenses.log || true
          yes | sdkmanager --licenses 2>&1 | tee -a /tmp/licenses.log || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a /tmp/licenses.log || true

      - name: Get dependencies
        run: flutter pub get 2>&1 | tee /tmp/pubget.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Verify APK produced
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "::error::APK file not found - build did not produce output"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: Show APK signing info
        # 自检：确认本次出包用的就是固定签名（alias=yizhanghe）
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk 2>&1 | grep -i "signer" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Report failure details
        # 兜底：任何步骤失败都上报。重点抓 Dart 编译错误行（lib/...: Error: ...）
        if: failure()
        run: |
          {
            echo "### Dart / build errors"
            echo '```'
            if [ -f /tmp/build.log ]; then
              grep -nE "^lib/|^test/|\.dart:[0-9]+|Error:|error •|is not defined|isn't defined|Undefined|Cannot |Expected |Unexpected |Unresolved " /tmp/build.log | head -50
            fi
            echo '```'
            echo ""
            echo "### build.log tail 60"
            echo '```'
            [ -f /tmp/build.log ] && tail -60 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          DART=$(grep -nE "\.dart:[0-9]+|Error:|is not defined|isn't defined|Undefined|Expected " /tmp/build.log 2>/dev/null | head -20 | tr '\n' ' ' | cut -c1-2500)
          if [ -z "$DART" ]; then
            DART=$(tail -30 /tmp/build.log 2>/dev/null | tr '\n' ' ' | cut -c1-2500)
          fi
          echo "::error title=Build failed::${DART}"
